name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node -e "require('fs').mkdirSync('node_modules/vscode',{recursive:true});require('fs').copyFileSync('test/fixtures/vscode-mock.mjs','node_modules/vscode/index.mjs')"
      - run: node --test test/unit.test.mjs
      - run: npx eslint . --quiet
